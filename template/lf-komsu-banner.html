<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:2048px; height:1152px; overflow:hidden; -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
.bg { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, #3a2200 0%, #241500 55%, #160d00 100%); }
/* yumusak turuncu isik */
.glow { position:absolute; left:50%; top:42%; width:1700px; height:700px; transform:translate(-50%,-50%);
  background:radial-gradient(ellipse, rgba(224,138,43,0.30) 0%, rgba(224,138,43,0) 65%); }
/* ince desen: kose susu */
.dots { position:absolute; inset:0; opacity:0.06;
  background-image:radial-gradient(#E08A2B 2.5px, transparent 2.5px); background-size:46px 46px; }
/* GUVENLI ALAN: ortada 1546x423 - tum cihazlarda gorunur */
.safe { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:1546px; height:423px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.kicker { display:flex; align-items:center; gap:18px; margin-bottom:20px; }
.kdot { width:9px; height:9px; background:#E08A2B; transform:rotate(45deg); }
.kicker span { font-family:'Inter',sans-serif; font-weight:700; font-size:30px; letter-spacing:13px;
  text-transform:uppercase; color:#ffce93; }
.title { font-family:'Anton',sans-serif; font-size:148px; line-height:0.95; letter-spacing:2px;
  text-transform:uppercase; color:#ffffff; -webkit-text-stroke:2px #1a0c00;
  text-shadow:5px 6px 0 #1a0c00, 0 14px 40px rgba(0,0,0,0.6); }
.title b { color:#E08A2B; }
.slogan { margin-top:22px; font-family:'Inter',sans-serif; font-weight:700; font-size:46px;
  letter-spacing:2px; color:#ffffff; }
.sub { margin-top:30px; display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
.pill { font-family:'Inter',sans-serif; font-weight:700; font-size:28px; letter-spacing:1px;
  color:#1a0c00; background:#E08A2B; padding:9px 26px; border-radius:999px; }
.pill.ghost { color:#ffce93; background:transparent; border:2px solid rgba(224,138,43,0.7); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="glow"></div>
  <div class="dots"></div>
  <div class="safe">
    <div class="kicker"><span class="kdot"></span><span>Evde İşini Kolaylaştır</span><span class="kdot"></span></div>
    <div class="title">Komşu <b>Tüyosu</b></div>
    <div class="slogan">Pratik Bilgiler, Kolay Çözümler</div>
    <div class="sub">
      <span class="pill">Her Gün Yeni İpucu</span>
      <span class="pill ghost">Cumartesi &amp; Pazartesi Uzun Videolar</span>
    </div>
  </div>
</body>
</html>
