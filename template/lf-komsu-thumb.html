<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
.bg { position:absolute; inset:0;
  background-image:url('{{bgImage}}'); background-size:cover; background-position:center; }
/* Sol tarafi koyulastir (metin okunsun), sag tarafta gorsel nefes alsin */
.shade { position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(15,8,0,0.92) 0%, rgba(15,8,0,0.78) 48%, rgba(15,8,0,0.30) 78%, rgba(15,8,0,0.12) 100%); }
.shade2 { position:absolute; inset:0;
  background:linear-gradient(0deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 40%); }
.frame { position:absolute; inset:0; border:10px solid #E08A2B; }
.content { position:absolute; inset:0; display:flex; flex-direction:column;
  justify-content:center; padding:0 64px; }
.brand {
  display:inline-block; align-self:flex-start;
  font-family:'Inter', sans-serif; font-weight:800;
  font-size:26px; letter-spacing:8px; text-transform:uppercase;
  color:#ffffff; background:#E08A2B; padding:7px 22px; border-radius:8px;
  margin-bottom:26px;
  box-shadow:0 6px 18px rgba(0,0,0,0.5);
}
.top {
  font-family:'Inter', sans-serif; font-weight:700;
  font-size:46px; letter-spacing:1px; color:#ffffff; line-height:1.05;
  text-shadow:0 3px 12px rgba(0,0,0,0.9);
  margin-bottom:6px;
}
.big {
  font-family:'Anton', 'Bebas Neue', sans-serif; font-weight:400;
  font-size:128px; line-height:0.94; text-transform:uppercase; letter-spacing:1px;
  color:#ffffff;
  text-shadow:5px 5px 0 #1a0c00, 0 10px 30px rgba(0,0,0,0.8);
  margin-bottom:34px;
}
.big .hl { color:#ffb152; }
.list { display:flex; flex-wrap:wrap; gap:14px 16px; max-width:760px; }
.chip {
  display:flex; align-items:center; gap:9px;
  font-family:'Inter', sans-serif; font-weight:700;
  font-size:30px; color:#ffffff; text-transform:uppercase; letter-spacing:1px;
  background:rgba(0,0,0,0.42); border:2px solid rgba(224,138,43,0.9);
  padding:8px 18px; border-radius:999px;
  text-shadow:0 2px 6px rgba(0,0,0,0.9);
}
.chip .tick { color:#E08A2B; font-size:26px; font-weight:800; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="shade2"></div>
  <div class="content">
    <span class="brand">Komşu Tüyosu</span>
    <div class="top">{{topLine}}</div>
    <div class="big">{{bigLine}}</div>
    <div class="list">{{chips}}</div>
  </div>
  <div class="frame"></div>
</body>
</html>
