<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<style>
* { margin:0; padding:0; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
.g1, .g2, .v { position:absolute; inset:0; }
/* Komsu sahneleri parlak (mutfak/ev) - metin okunabilirligi icin biraz daha guclu karartma */
.g1 { background:linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.18) 28%, rgba(0,0,0,0.18) 64%, rgba(0,0,0,0.62) 100%); }
.g2 { background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.50) 100%); }
.v  { background:rgba(0,0,0,0.26); }
</style></head>
<body>
  <div class="v"></div>
  <div class="g2"></div>
  <div class="g1"></div>
</body></html>
