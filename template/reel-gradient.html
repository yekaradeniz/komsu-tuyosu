<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  /* Gradient karartma kapatildi (kullanici karari): arka plan video oldugu
     gibi gozuksun, text-shadow ile metin okunabilirligi saglanir. */
  .gradient { position: absolute; inset: 0; background: transparent; }

  /* KALICI ABONE ROZETI - video boyunca gorunur.
     Sebep: sondaki ABONE OL kartini izleyicilerin sadece dortte biri goruyor
     (olculdu: %90 noktasinda audienceWatchRatio 0.17-0.27). Rozet ilk kareden
     itibaren gorundugu icin butun izleyicilere ulasir.

     SAFE ZONE (1080x1920 Shorts):
       ust  ~180px  durum cubugu + arama
       alt  ~520px  baslik, kanal adi, aciklama, ses satiri
       sag  ~220px  begeni / yorum / paylas / menu / kanal avatari
       sol   ~50px  kenar bosluğu
     Rozet sol ust guvenli alanda: left 64, top 210.

     Arka plan kutusu YOK (kullanici karari): sadece isaret ve yazi, beyaz
     kontur videonun uzerinde okunakligi sagliyor. */
  .sub-badge {
    position: absolute; top: 210px; left: 64px;
    width: 208px;
    display: flex; flex-direction: column; align-items: center;
    transform: rotate(-4deg);
  }
  .sub-badge .play {
    width: 122px; height: 86px;
    background: #FF0000;
    border-radius: 26px;
    display: flex; align-items: center; justify-content: center;
    border: 7px solid #fff;
    box-shadow: 0 5px 14px rgba(0,0,0,0.45);
    margin-bottom: -10px;
  }
  .sub-badge .play::after {
    content: ""; width: 0; height: 0;
    border-left: 30px solid #fff;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    margin-left: 7px;
  }
  .sub-badge .txt {
    font-family: "Luckiest Guy", Impact, system-ui, sans-serif;
    font-size: 52px; line-height: 0.92;
    color: #FF0000;
    text-align: center; letter-spacing: 0.02em;
    /* Kalin beyaz kontur: video arka plani ne olursa olsun okunur kalsin */
    -webkit-text-stroke: 11px #fff;
    paint-order: stroke fill;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,0.45));
  }
</style>
</head>
<body>
  <div class="gradient"></div>
  <div class="sub-badge">
    <div class="play"></div>
    <div class="txt">ABONE<br>OL</div>
  </div>
</body>
</html>
