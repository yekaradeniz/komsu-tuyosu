<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
.wrap { width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:80px 240px; }
.badge {
  display:flex; align-items:center; gap:18px; margin-bottom:50px;
}
.num {
  font-family:'Anton', sans-serif; font-weight:400;
  font-size:40px; letter-spacing:2px; color:#ffffff;
  background-color:#E08A2B; padding:6px 26px; border-radius:999px;
  -webkit-text-stroke:1px #1a0c00;
  text-shadow:2px 2px 0 #1a0c00, 0 6px 16px rgba(0,0,0,0.7);
}
.num-label {
  font-family:'Inter', sans-serif; font-weight:700;
  font-size:26px; letter-spacing:12px; text-transform:uppercase;
  color:#ffe2bd; text-shadow:0 2px 8px rgba(0,0,0,0.9);
}
.question {
  font-family:'Inter', sans-serif; font-weight:700;
  font-size:{{questionFontSize}}; line-height:1.42;
  color:#ffffff; text-align:center; max-width:1440px;
  text-shadow:
    0 0 8px rgba(0,0,0,0.95),
    0 2px 8px rgba(0,0,0,0.95),
    0 4px 16px rgba(0,0,0,0.85),
    0 8px 34px rgba(0,0,0,0.7);
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">
      <span class="num">{{num}}</span>
      <span class="num-label">{{title}}</span>
    </div>
    <div class="question" id="question">{{question}}</div>
  </div>
<script>
  const el = document.querySelector('#question');
  const wrap = document.querySelector('.wrap');
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (wrap.scrollHeight > 1080 && size > 34) { size -= 1; el.style.fontSize = size + 'px'; }
</script>
</body>
</html>
